apply plugin: "com.android.application"

// Fix: kotlin-stdlib 1.8+ already contains the jdk7/jdk8 classes,
// so exclude the old separate artifacts to avoid "Duplicate class" errors.
configurations.all {
    exclude(group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7")
    exclude(group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8")
}

android {
    namespace "com.carbonnexusgreen.fcr"
    compileSdk 34

    defaultConfig {
        applicationId "com.carbonnexusgreen.fcr"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.webkit:webkit:1.10.0")
}
